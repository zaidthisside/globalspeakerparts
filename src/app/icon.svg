<svg 
  viewBox="0 0 160 160" 
  xmlns="http://www.w3.org/2000/svg"
>
  <g>
    {/* Outer Ring */}
    <circle cx="80" cy="80" r="72" fill="none" stroke="#0F0F10" strokeWidth="6.5" />
    {/* Concentric rings representing speaker spider/cone suspensions */}
    <circle cx="80" cy="80" r="54" fill="none" stroke="#0F0F10" strokeWidth="5.5" />
    <circle cx="80" cy="80" r="38" fill="none" stroke="#0F0F10" strokeWidth="5.5" />
    <circle cx="80" cy="80" r="23" fill="none" stroke="#0F0F10" strokeWidth="5.5" />
    {/* Central circle (dust cap) */}
    <circle cx="80" cy="80" r="11" fill="#0F0F10" />
    {/* Latitude & Longitude globe grids */}
    <line x1="8" y1="80" x2="152" y2="80" stroke="#0F0F10" strokeWidth="3" />
    <line x1="80" y1="8" x2="80" y2="152" stroke="#0F0F10" strokeWidth="3" />
    {/* Elliptical globe curves */}
    <path d="M 80,8 A 50,72 0 0,0 80,152" fill="none" stroke="#0F0F10" strokeWidth="3" />
    <path d="M 80,8 A 50,72 0 0,1 80,152" fill="none" stroke="#0F0F10" strokeWidth="3" />
    <path d="M 80,8 A 82,72 0 0,0 80,152" fill="none" stroke="#0F0F10" strokeWidth="3" opacity="0.85" />
    <path d="M 80,8 A 82,72 0 0,1 80,152" fill="none" stroke="#0F0F10" strokeWidth="3" opacity="0.85" />
  </g>
</svg>
